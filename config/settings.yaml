# MTOP pipeline settings. Paths are relative to the repository root.

cohort:
  min_age: 18                     # patients recorded as younger are excluded; a missing age is kept (imputed)
  require_outcome: true           # 90-day mRS must be known
  min_category: 30                # a detailed occlusion code with fewer patients is pooled into its parent for modelling
  exclude_diagnostic_only: false  # "PAG" (diagnostic angiography only) is kept: at admission every patient
                                  # taken for intended thrombectomy belongs to the population, as in the 2026 analysis
  exclude_impossible_times: false # false: an impossible time (IVT after puncture, recanalisation before
                                  # puncture) becomes missing and the patient stays; true: the patient is
                                  # removed, as in the 2026 analysis (29 records)

split:
  temporal_test_from_year: 2023     # primary: development 2005-2022, temporal validation 2023-2025
  sensitivity_test_from_year: 2021  # sensitivity: development <= 2020, validation 2021-2025 (more events)
  recent_era_from_year: 2023        # deployed models: intercept re-estimated on the pooled last three years

seed: 20261016

cv:
  folds: 5
  repeats: 3

tuning:
  trials: 50
  max_rounds: 3000
  early_stopping: 100

# Model choice, pre-specified as in the 2026 analysis: regression with splines is the reference.
# A candidate replaces it only if (a) its paired 95% CI of the AUROC difference on the temporal
# test lies above zero, or (b) in nested cross-validation its mean AUROC gain is >= 0.01 and it is
# better in >= 80% of the outer folds; in both cases its mean |calibration-in-the-large| may be at
# most 0.05 worse than the reference's.
selection:
  reference: "Logistic regression (splines)"
  min_cv_gain: 0.01
  min_cv_share: 0.8
  max_citl_worse: 0.05
  deployable: ["Logistic regression (splines)", "Logistic regression", "LightGBM", "XGBoost"]

nested_cv:                # internal validation on all years (admission stage, mRS 0-2), as in the 2026 analysis
  folds: 5
  repeats: 3
  trials: 20              # inner tuning budget per learner (the same for every learner)

bootstrap:
  n: 2000

privacy:
  min_cell: 10      # aggregate cells with fewer patients are suppressed in public outputs
  min_leaf: 20      # every LightGBM leaf must contain at least this many training patients

targets:
  good_outcome:
    label: {en: "Functional independence (mRS 0–2) at 90 days", cs: "Funkční nezávislost (mRS 0–2) za 90 dní"}
    short: {en: "mRS 0–2", cs: "mRS 0–2"}
    sign: 1        # monotone constraints in features.yaml are written for this target
    primary: true
  death90:
    label: {en: "Death within 90 days (mRS 6)", cs: "Úmrtí do 90 dní (mRS 6)"}
    short: {en: "Death", cs: "Úmrtí"}
    sign: -1       # constraints are flipped for mortality
    primary: false

stages:
  - id: admission
    order: 1
    label: {en: "Admission", cs: "Příjem"}
    title: {en: "Before thrombectomy", cs: "Před trombektomií"}
    requires: []
  - id: procedure
    order: 2
    label: {en: "End of procedure", cs: "Konec výkonu"}
    title: {en: "End of the procedure", cs: "Konec výkonu"}
    requires: [tici]
  - id: h24
    order: 3
    label: {en: "24 hours", cs: "24 hodin"}
    title: {en: "24 hours after treatment", cs: "24 hodin po léčbě"}
    requires: [tici, nihss_24h]     # alive and assessed at 24 h
  - id: d7
    order: 4
    label: {en: "Day 7", cs: "7. den"}
    title: {en: "Day 7", cs: "7. den"}
    requires: [tici, nihss_7d]      # alive and assessed at day 7 (a missing 24-h NIHSS is allowed)

site:
  title: "MTOP · Mechanical Thrombectomy Outcome Predictor"
  repo_url: "https://github.com/viktorgajdosik/mt"
  site_url: "https://viktorgajdosik.github.io/mt/"
  contact: "viktor.gajdosik@fno.cz"
  authors:
    - name: "Viktor Gajdošík"
      affiliations: &aff
        - {en: "Faculty of Medicine, University of Ostrava", cs: "Lékařská fakulta Ostravské univerzity"}
        - {en: "University Hospital Ostrava", cs: "Fakultní nemocnice Ostrava"}
    - name: "Václav Procházka"
      affiliations: *aff
  funding:
    en: "Student grant SGS18/LF/2026, Faculty of Medicine, University of Ostrava"
    cs: "Studentská grantová soutěž SGS18/LF/2026, Lékařská fakulta Ostravské univerzity"
