# Predictor registry: one entry per model input.
#
# The admission stage uses the 33 pre-procedural predictors of the 2026 FNO analysis ("set v2":
# merged categories, no etiology or cholesterol, with the derived onset-time, IVT-to-puncture,
# pulse-pressure and hyperglycaemia variables). The later stages add what the same analysis added:
# reperfusion and procedure details at the end of the procedure, the 24-hour NIHSS course and
# haemorrhage at 24 hours, and the day-7 NIHSS, oedema and decompression at day 7.
#
# stage     first stage at which the predictor is used (admission | procedure | h24 | d7);
#           later stages reuse all earlier predictors.
# type      numeric | binary | ordinal | categorical | derived
# monotone  +1 = higher value can only raise P(mRS 0–2); -1 = can only lower it; 0 = free.
#           Used by LightGBM only; flipped automatically for the mortality model.
# optional  true = the calculator offers "unknown"; the estimate is then averaged over the
#           registry's values of that input.
# group     where the calculator shows the input (admission stage).
# Categorical predictors are one-hot encoded (minus the reference level, if one is given); a
# missing category sets all its columns to missing.

features:
  # ------------------------------------------------------------------ admission: patient
  - key: age
    stage: admission
    group: patient
    type: numeric
    monotone: -1
    min: 18
    max: 100
    step: 1
    default: 70
    unit: {en: "years", cs: "let"}
    label: {en: "Age", cs: "Věk"}

  - key: sex_male
    stage: admission
    group: patient
    type: binary
    monotone: 0
    default: 1
    label: {en: "Sex", cs: "Pohlaví"}
    options:
      - {value: 1, label: {en: "Male", cs: "Muž"}}
      - {value: 0, label: {en: "Female", cs: "Žena"}}

  - key: mrs_pre
    stage: admission
    group: patient
    type: ordinal
    monotone: -1
    default: 0
    label: {en: "Pre-stroke mRS", cs: "mRS před CMP"}
    options:
      - {value: 0, label: {en: "0 · no symptoms", cs: "0 · bez příznaků"}}
      - {value: 1, label: {en: "1 · no significant disability", cs: "1 · bez významného postižení"}}
      - {value: 2, label: {en: "2 · slight disability", cs: "2 · lehké postižení"}}
      - {value: 3, label: {en: "3 · moderate disability", cs: "3 · středně těžké postižení"}}
      - {value: 4, label: {en: "4 · moderately severe", cs: "4 · středně těžké až těžké"}}
      - {value: 5, label: {en: "5 · severe disability", cs: "5 · těžké postižení"}}

  # ------------------------------------------------------------------ admission: the stroke
  - key: nihss_adm
    stage: admission
    group: stroke
    type: numeric
    monotone: -1
    min: 0
    max: 42
    step: 1
    default: 16
    label: {en: "NIHSS on admission", cs: "NIHSS při přijetí"}

  - key: occlusion
    stage: admission
    group: stroke
    type: categorical
    monotone: 0
    default: M1
    label: {en: "Occlusion site", cs: "Místo okluze"}
    help: {en: "Tandem: a cervical ICA/CCA lesion plus an intracranial occlusion. M3 occlusions are grouped with M2 (same artery). A site needs at least 10 patients in the registry before the models can estimate it; the ACA is kept as its own choice but has no estimate yet.",
           cs: "Tandem: léze krční ACI/ACC spolu s intrakraniálním uzávěrem. Uzávěry M3 jsou sloučeny s M2 (stejná tepna). Místo okluze musí mít v registru alespoň 10 pacientů, aby je modely mohly odhadnout; ACA je vedena jako samostatná volba, ale odhad pro ni zatím není."}
    # `model: false`: offered for entry, no model term until the site has privacy.min_cell patients
    options:
      - {value: ICA, label: {en: "Intracranial ICA", cs: "Intrakraniální ACI"}}
      - {value: tandem, label: {en: "Tandem (cervical ICA/CCA + intracranial)", cs: "Tandem (krční ACI/ACC + intrakraniální)"}}
      - {value: cervical_ICA, label: {en: "Cervical ICA / CCA", cs: "Krční ACI / ACC"}}
      - {value: M1, label: {en: "MCA M1", cs: "ACM M1"}}
      - {value: M2, label: {en: "MCA M2 / M3", cs: "ACM M2 / M3"}}
      - {value: ACA, model: false, label: {en: "ACA · no estimate yet", cs: "ACA · zatím bez odhadu"}}
      - {value: basilar, label: {en: "Basilar artery", cs: "A. basilaris"}}
      - {value: basilar_vertebral, label: {en: "Basilar + vertebral", cs: "A. basilaris + AV"}}
      - {value: other_posterior, label: {en: "Vertebral / PCA", cs: "AV / ACP"}}

  - key: side_left
    stage: admission
    group: stroke
    type: binary
    monotone: 0
    default: 1
    label: {en: "Affected hemisphere", cs: "Postižená hemisféra"}
    options:
      - {value: 1, label: {en: "Left", cs: "Levá"}}
      - {value: 0, label: {en: "Right", cs: "Pravá"}}
    posterior_value: 0      # forced for basilar / vertebral / PCA occlusions

  - key: aspects
    stage: admission
    group: stroke
    type: numeric
    monotone: 1
    min: 0
    max: 10
    step: 1
    default: 9
    optional: true
    label: {en: "ASPECTS", cs: "ASPECTS"}
    help: {en: "Non-contrast CT, middle cerebral artery territory. Recorded in the registry from 2016.",
           cs: "Nativní CT, povodí arteria cerebri media. V registru evidováno od roku 2016."}

  # ------------------------------------------------------------------ admission: pathway and timing
  - key: ivt
    stage: admission
    group: pathway
    type: binary
    monotone: 0
    default: 1
    label: {en: "IV thrombolysis", cs: "Intravenózní trombolýza"}
    options:
      - {value: 1, label: {en: "Yes", cs: "Ano"}}
      - {value: 0, label: {en: "No", cs: "Ne"}}

  - key: ivt_external
    stage: admission
    group: pathway
    type: binary
    monotone: 0
    default: 0
    requires_ivt: true      # forced to "no" without IV thrombolysis
    label: {en: "Thrombolysis given", cs: "Trombolýza podána"}
    options:
      - {value: 0, label: {en: "At FNO", cs: "Ve FNO"}}
      - {value: 1, label: {en: "In another hospital", cs: "V jiné nemocnici"}}

  - key: onset_to_ivt
    stage: admission
    group: pathway
    type: numeric
    monotone: 0
    min: 20
    max: 600
    step: 5
    default: 120
    optional: true
    requires_ivt: true      # not applicable without IV thrombolysis (passed to the model as missing)
    unit: {en: "min", cs: "min"}
    label: {en: "Onset to IV thrombolysis", cs: "Od vzniku do IV trombolýzy"}

  - key: transfer
    stage: admission
    group: pathway
    type: binary
    monotone: 0
    default: 0
    label: {en: "Admission route", cs: "Způsob přijetí"}
    options:
      - {value: 0, label: {en: "Direct to FNO", cs: "Přímo do FNO"}}
      - {value: 1, label: {en: "Transferred from another hospital", cs: "Překlad z jiné nemocnice"}}

  - key: onset_to_puncture
    stage: admission
    group: pathway
    type: numeric
    monotone: -1
    min: 30
    max: 1440
    step: 5
    default: 180
    optional: true
    unit: {en: "min", cs: "min"}
    label: {en: "Onset to groin puncture", cs: "Od vzniku do punkce"}
    help: {en: "From symptom onset or last known well.", cs: "Od vzniku příznaků nebo od doby, kdy byl naposledy v pořádku."}

  - key: onset_hour
    stage: admission
    group: pathway
    type: numeric
    monotone: 0
    min: 0
    max: 23.5
    step: 0.5
    default: 9
    optional: true
    unit: {en: "h", cs: "h"}
    label: {en: "Time of onset", cs: "Čas vzniku"}
    help: {en: "Clock time of symptom onset or last known well.", cs: "Hodina vzniku příznaků nebo doby, kdy byl naposledy v pořádku."}

  - key: weekend
    stage: admission
    group: pathway
    type: binary
    monotone: 0
    default: 0
    optional: true
    label: {en: "Onset at the weekend", cs: "Vznik o víkendu"}
    options:
      - {value: 0, label: {en: "Weekday", cs: "Pracovní den"}}
      - {value: 1, label: {en: "Saturday or Sunday", cs: "Sobota nebo neděle"}}

  # ------------------------------------------------------------------ admission: vital signs and labs
  - key: glucose
    stage: admission
    group: vitals
    type: numeric
    monotone: -1
    min: 2
    max: 30
    step: 0.1
    default: 7
    optional: true
    unit: {en: "mmol/L", cs: "mmol/l"}
    label: {en: "Glucose on admission", cs: "Glykémie při přijetí"}

  - key: sbp
    stage: admission
    group: vitals
    type: numeric
    monotone: 0
    min: 70
    max: 260
    step: 1
    default: 150
    optional: true
    unit: {en: "mmHg", cs: "mmHg"}
    label: {en: "Systolic blood pressure", cs: "Systolický tlak"}

  - key: dbp
    stage: admission
    group: vitals
    type: numeric
    monotone: 0
    min: 30
    max: 160
    step: 1
    default: 85
    optional: true
    unit: {en: "mmHg", cs: "mmHg"}
    label: {en: "Diastolic blood pressure", cs: "Diastolický tlak"}

  - key: bmi
    stage: admission
    group: vitals
    type: numeric
    monotone: 0
    min: 14
    max: 50
    step: 0.5
    default: 27
    optional: true
    unit: {en: "kg/m²", cs: "kg/m²"}
    label: {en: "Body mass index", cs: "Index tělesné hmotnosti (BMI)"}

  # ------------------------------------------------------------------ admission: history and medication
  - key: htn
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 1
    label: {en: "Hypertension", cs: "Hypertenze"}
    options: &yesno
      - {value: 1, label: {en: "Yes", cs: "Ano"}}
      - {value: 0, label: {en: "No", cs: "Ne"}}

  - key: dm
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Diabetes mellitus", cs: "Diabetes mellitus"}
    options: *yesno

  - key: hld
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Hyperlipidaemia", cs: "Hyperlipidémie"}
    options: *yesno

  - key: arrhythmia
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Atrial fibrillation / arrhythmia", cs: "Fibrilace síní / arytmie"}
    options: *yesno

  - key: stroke_prior
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Previous stroke", cs: "Předchozí CMP"}
    options: *yesno

  - key: tia_prior
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Previous TIA", cs: "Předchozí TIA"}
    options: *yesno

  - key: smoking
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Smoker", cs: "Kuřák"}
    options: *yesno

  - key: alcohol
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Alcohol abuse", cs: "Abúzus alkoholu"}
    options: *yesno

  - key: statin
    stage: admission
    group: history
    type: binary
    monotone: 0
    default: 0
    label: {en: "Statin before stroke", cs: "Statin před CMP"}
    options: *yesno

  - key: heart3
    stage: admission
    group: history
    type: categorical
    monotone: 0
    default: none
    reference: none
    label: {en: "Heart condition", cs: "Srdeční onemocnění"}
    help: {en: "Other: valve disease or replacement, cardiomyopathy, PFO, left-atrial thrombus, pacemaker.",
           cs: "Jiné: chlopenní vada nebo náhrada, kardiomyopatie, PFO, trombus v levé síni, kardiostimulátor."}
    options:
      - {value: none, label: {en: "None", cs: "Žádné"}}
      - {value: coronary, label: {en: "Coronary heart disease", cs: "ICHS"}}
      - {value: other, label: {en: "Other", cs: "Jiné"}}

  - key: antithrombotic
    stage: admission
    group: history
    type: categorical
    monotone: 0
    default: none
    reference: none
    label: {en: "Antithrombotics before stroke", cs: "Antitrombotika před CMP"}
    help: {en: "Anticoagulant: warfarin, DOAC or LMWH. Antiplatelet: aspirin, clopidogrel or both.",
           cs: "Antikoagulancia: warfarin, DOAC nebo LMWH. Antiagregancia: kyselina acetylsalicylová, klopidogrel nebo obojí."}
    options:
      - {value: none, label: {en: "None", cs: "Žádná"}}
      - {value: antiplatelet, label: {en: "Antiplatelet", cs: "Antiagregancia"}}
      - {value: anticoagulant, label: {en: "Anticoagulant", cs: "Antikoagulancia"}}

  # ------------------------------------------------------------------ admission: derived
  - key: night_onset
    stage: admission
    type: derived
    monotone: 0
    formula: "onset_hour >= 22 or onset_hour < 6"
    label: {en: "Onset at night (22–6 h)", cs: "Vznik v noci (22–6 h)"}

  - key: ivt_to_puncture
    stage: admission
    type: derived
    monotone: 0
    formula: "onset_to_puncture - onset_to_ivt"
    label: {en: "IV thrombolysis to puncture", cs: "Od IV trombolýzy do punkce"}

  - key: pulse_pressure
    stage: admission
    type: derived
    monotone: 0
    formula: "sbp - dbp"
    label: {en: "Pulse pressure", cs: "Pulzní tlak"}

  - key: hyperglycemia
    stage: admission
    type: derived
    monotone: -1
    formula: "glucose > 7.8"
    label: {en: "Glucose above 7.8 mmol/L", cs: "Glykémie nad 7,8 mmol/l"}

  # ------------------------------------------------------------------ end of procedure
  - key: tici
    stage: procedure
    type: ordinal
    monotone: 1
    default: 4
    label: {en: "Final reperfusion (mTICI)", cs: "Výsledná reperfuze (mTICI)"}
    options:
      - {value: 0, label: {en: "0", cs: "0"}}
      - {value: 1, label: {en: "1", cs: "1"}}
      - {value: 2, label: {en: "2a", cs: "2a"}}
      - {value: 3, label: {en: "2b", cs: "2b"}}
      - {value: 4, label: {en: "3", cs: "3"}}
    note: "Registry grade '2' without subgrade is coded 2.5 (between 2a and 2b); not offered as an input."

  - key: technique
    stage: procedure
    type: categorical
    monotone: 0
    default: aspiration
    reference: none          # all one-hot columns 0
    label: {en: "Procedure", cs: "Výkon"}
    options:
      - {value: aspiration, label: {en: "Thrombectomy: direct aspiration (ADAPT)", cs: "Trombektomie: přímá aspirace (ADAPT)"}}
      - {value: stent_retriever, label: {en: "Thrombectomy: stent retriever", cs: "Trombektomie: stentriever"}}
      - {value: solumbra, label: {en: "Thrombectomy: Solumbra (aspiration + stent retriever)", cs: "Trombektomie: Solumbra (aspirace + stentriever)"}}
      - {value: combined, label: {en: "Thrombectomy: combined procedure (two or more techniques)", cs: "Trombektomie: kombinovaný výkon (dvě a více technik)"}}
      - {value: none, label: {en: "No thrombectomy: stent, angioplasty or intra-arterial lysis", cs: "Bez trombektomie: stent, angioplastika nebo intraarteriální lýza"}}
      - {value: diagnostic, label: {en: "Diagnostic angiography only", cs: "Pouze diagnostická angiografie"}}

  - key: stenting
    stage: procedure
    type: binary
    monotone: 0
    default: 0
    label: {en: "Stent placed", cs: "Zavedení stentu"}
    help: {en: "Carotid or intracranial stent during the procedure.", cs: "Karotický nebo intrakraniální stent během výkonu."}
    options: *yesno

  - key: angioplasty
    stage: procedure
    type: binary
    monotone: 0
    default: 0
    label: {en: "Angioplasty (PTA)", cs: "Angioplastika (PTA)"}
    options: *yesno

  - key: ia_lysis
    stage: procedure
    type: binary
    monotone: 0
    default: 0
    label: {en: "Intra-arterial thrombolysis", cs: "Intraarteriální trombolýza"}
    help: {en: "Local intra-arterial lysis (LIAT, EKOS) or an intra-arterial thrombolytic.", cs: "Lokální intraarteriální lýza (LIAT, EKOS) nebo intraarteriálně podané trombolytikum."}
    options: *yesno

  - key: procedure_min
    stage: procedure
    type: numeric
    monotone: -1
    min: 5
    max: 240
    step: 5
    default: 45
    optional: true
    unit: {en: "min", cs: "min"}
    label: {en: "Procedure duration", cs: "Délka výkonu"}
    help: {en: "Groin puncture to recanalisation or end of procedure.", cs: "Od punkce do rekanalizace nebo ukončení výkonu."}

  - key: onset_to_recan
    stage: procedure
    type: numeric
    monotone: 0
    min: 30
    max: 1500
    step: 5
    default: 225
    optional: true
    unit: {en: "min", cs: "min"}
    label: {en: "Onset to recanalisation", cs: "Od vzniku do rekanalizace"}

  - key: anesthesia
    stage: procedure
    type: categorical
    monotone: 0
    default: general
    optional: true
    label: {en: "Anaesthesia", cs: "Anestezie"}
    options:
      - {value: general, label: {en: "General", cs: "Celková"}}
      - {value: sedation, label: {en: "Conscious sedation", cs: "Analgosedace"}}
      - {value: local, label: {en: "Local only", cs: "Lokální (bez ARO)"}}

  # ------------------------------------------------------------------ 24 hours
  - key: nihss_24h
    stage: h24
    type: numeric
    monotone: -1
    min: 0
    max: 42
    step: 1
    default: 8
    label: {en: "NIHSS at 24 h", cs: "NIHSS za 24 h"}

  - key: sich
    stage: h24
    type: binary
    monotone: -1
    default: 0
    label: {en: "Symptomatic intracranial haemorrhage", cs: "Symptomatické intrakraniální krvácení"}
    options: *yesno

  - key: ich_other
    stage: h24
    type: binary
    monotone: 0
    default: 0
    label: {en: "Asymptomatic intracranial haemorrhage", cs: "Asymptomatické intrakraniální krvácení"}
    options: *yesno

  - key: nihss_change_24h
    stage: h24
    type: derived
    monotone: -1
    formula: "nihss_24h - nihss_adm"
    label: {en: "NIHSS change in 24 h", cs: "Změna NIHSS za 24 h"}

  - key: eni_24h
    stage: h24
    type: derived
    monotone: 1
    formula: "nihss_adm - nihss_24h >= 8 or nihss_24h <= 1"
    label: {en: "Early neurological improvement", cs: "Časné neurologické zlepšení"}

  # ------------------------------------------------------------------ day 7
  - key: nihss_7d
    stage: d7
    type: numeric
    monotone: -1
    min: 0
    max: 42
    step: 1
    default: 6
    label: {en: "NIHSS on day 7", cs: "NIHSS 7. den"}

  - key: edema
    stage: d7
    type: binary
    monotone: -1
    default: 0
    label: {en: "Cerebral oedema", cs: "Mozkový edém"}
    options: *yesno

  - key: decompression
    stage: d7
    type: binary
    monotone: 0
    default: 0
    label: {en: "Decompressive craniectomy", cs: "Dekompresivní kraniektomie"}
    options: *yesno
