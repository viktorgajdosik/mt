name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No patient data in the repository
        run: bash scripts/check_no_patient_data.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit, parity and privacy tests
        run: pytest -q

      - name: End-to-end pipeline on synthetic data (temporary output folder)
        env:
          MTOP_E2E: "1"
        run: pytest -q tests/test_synthetic_pipeline.py
