[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtop"
version = "1.0.0"
description = "Staged, explainable prediction of 90-day outcome after mechanical thrombectomy (FNO registry)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Viktor Gajdošík"}, {name = "Václav Procházka"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "optuna>=3.6",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
federated = ["cryptography>=41"]
dev = ["pytest>=8", "cryptography>=41"]

[project.scripts]
mtop = "mtop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
